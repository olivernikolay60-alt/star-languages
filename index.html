<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭐ STAR LANGUAJES ⭐</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="logo">⭐ STAR LANGUAJES ⭐</div>
        <div class="header-buttons">
            <button onclick="mostrarLogin()">LOGIN</button>
            <button onclick="mostrarRegistro()">REGISTRARSE</button>
        </div>
    </header>

    <!-- MENÚ PRINCIPAL -->
    <div class="container">
        <div class="card" onclick="abrirPantalla('test')">📝<br>TEST</div>
        <div class="card" onclick="abrirPantalla('tips')">💡<br>CONSEJOS</div>
        <div class="card" onclick="abrirPantalla('game')">🎮<br>JUEGO</div>
    </div>

    <div class="press-start">PRESS START TO LEARN 🚀</div>

    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="overlay">
        <div class="form-box">
            <h2>LOGIN</h2>
            <input id="loginUser" placeholder="Usuario" type="text">
            <input id="loginPass" placeholder="Contraseña" type="password">
            <button onclick="entrar()">ENTRAR</button>
            <button onclick="cerrarOverlays()">VOLVER</button>
            <button onclick="mostrarRegistro()" class="btn-secundario">Crear cuenta nueva</button>
        </div>
    </div>

    <!-- REGISTRO OVERLAY -->
    <div id="registroOverlay" class="overlay">
        <div class="form-box">
            <h2>REGISTRO</h2>
            <input id="regUser" placeholder="Usuario" type="text">
            <input id="regPass" placeholder="Contraseña" type="password">
            <button onclick="registrar()">CREAR CUENTA</button>
            <button onclick="cerrarOverlays()">VOLVER</button>
        </div>
    </div>

    <!-- PANTALLA MODAL -->
    <div id="pantalla" class="overlay">
        <div class="modal-content">
            <h1 id="tituloPantalla"></h1>
            <div id="contenidoPantalla"></div>
            <button onclick="cerrarPantalla()" class="btn-cerrar">CERRAR</button>
        </div>
    </div>

    <!-- FULL SCREEN GAME -->
    <div id="gameContainer">
        <div class="game-header">
            <div onclick="salirDelJuego()" class="btn-salir">← SALIR</div>
            <div class="game-controls-hint">← → move · SPACE jump · avoid red spikes</div>
            <div id="gameHUD"></div>
        </div>
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <footer>
        <div class="ground"></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
